packages:
    - web
    - crawler
    - megajs
allowBuilds:
    core-js: true
    esbuild: true
    lightningcss: true
    msw: true

# Remove once https://github.com/better-auth/better-auth/pull/9554 closes
overrides:
    kysely: "^0.28.17"
permissions:
    "@tanstack/devtools-vite":
        skills: false
    "@tanstack/react-router":
        skills: false
    "@tanstack/react-start":
        skills: false
    "@tanstack/router-plugin":
        skills: false
    drizzle-kit:
        skills: [drizzle, drizzle-hints]
skills:
    dirs:
        - .agents/skills
